name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Android Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Bundle
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || 'df1c541385e699bbed7ffd32934162da' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBBUrSt0nBcKcg21sShUWqJ_BPLUNEINh8' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'bingeflix-7b30f.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'bingeflix-7b30f' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'bingeflix-7b30f.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '839516474748' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:839516474748:web:88639597084274c170e8f9' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-GB7KHZPLL8' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias bingeflix -keyalg RSA -keysize 2048 -validity 10000 -storepass bingeflix123 -keypass bingeflix123 -dname "CN=BingeFlix, OU=BingeFlix, O=BingeFlix, L=Mumbai, ST=Maharashtra, C=IN"
          cp android/app/release.keystore android/release.keystore || true

      - name: Build Android Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Dump Diagnostics on Failure
        if: failure()
        run: |
          echo "=== GRADLE FAILURE DIAGNOSTICS ==="
          find android/ -name "*.log" -o -name "*.txt" || true

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-logs
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/

      - name: Prepare Release APK Artifact
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" BingeFlix-release.apk
          cp "$APK_FILE" BingeFlix.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BingeFlix-release-apk
          path: BingeFlix.apk

      - name: Create Release with Signed APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: BingeFlix Android APK v1.0.0 (Signed Release)
          body: |
            ## 📱 BingeFlix Android Official Release
            ✅ **Signed Release APK** (No debug certificate issues)
            
            ### Installation Instructions:
            1. Download `BingeFlix.apk` to your Android phone.
            2. Tap on the downloaded file.
            3. If prompted:
               - Allow "Install from unknown sources" for your browser/file manager.
               - If Google Play Protect shows a notification, tap **"More details"** and select **"Install anyway"**.
            
            - **Package:** `com.bingeflix.app`
            - **Target:** Android 8.0 - Android 15 (API 24 - 34)
            - **Features:** 4K Multi-server streaming, Anime Sub/Dub, Cartoons, 4-Device accounts.
          files: |
            BingeFlix.apk
            BingeFlix-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

